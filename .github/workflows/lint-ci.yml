# Whole-repo Python source-lint gate. Adapted from unsloth's lint-ci.yml:
# Python (compileall + narrow ruff) + YAML/JSON round-trip. Dropped vs unsloth:
# shell lint (zoo has no committed *.sh), TypeScript/Rust (Unsloth/Tauri are unsloth-side).

name: Lint CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Latest-only on branches, never on main. Pushes to main land in bursts, so
  # cancelling superseded runs there throws away the run that would have
  # reported a regression, and the run that writes the shared caches.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  source-lint:
    name: Source lint (Python + YAML + JSON)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # This workflow file is its own key-file: the ruff and pyyaml pins are on
      # the install line below, so nothing else describes what this job downloads.
      - id: pip-cache
        uses: ./.github/actions/pip-cache-restore
        with:
          name: lint
          key-files: |
            .github/workflows/lint-ci.yml

      - run: pip install 'ruff==0.15.12' 'pyyaml>=6'

      - uses: ./.github/actions/pip-cache-save
        with:
          dir: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ steps.pip-cache.outputs.key }}
          cache-hit: ${{ steps.pip-cache.outputs.cache-hit }}

      - name: Python AST/syntax check (every committed .py must compile)
        # This runs on 3.12, so it cannot see syntax that is merely newer than the
        # declared floor. tests/test_python39_compatibility.py is what pins that.
        continue-on-error: true
        run: |
          python -m compileall -q -j 0 unsloth_zoo tests scripts

      - name: Python ruff check (narrow gate)
        # E9 / F63 / F7 / F82: syntax errors, broken comparisons, undefined names.
        # continue-on-error during CI bootstrap: first run on main surfaced 13
        # latent findings (rl_replacements.py L1128 F821). The gpt_oss match-on-3.9
        # one is fixed; the rest still need clearing before this can gate.
        continue-on-error: true
        run: |
          ruff check --select E9,F63,F7,F82 unsloth_zoo tests scripts

      - name: Dynamic-execution lint self-test
        run: python scripts/lint_dynamic_exec.py --self-test

      - name: No exec/eval/compile of an interpolated string
        # PR #1083: a model_type off a downloaded config.json was interpolated into an
        # exec'd import. Bare exec(inspect.getsource(...)) is normal here and is not
        # flagged; a built string is, unless it carries a written justification in
        # scripts/dynamic_exec_allowlist.json.
        run: python scripts/lint_dynamic_exec.py

      - name: No leftover debugger / pdb / breakpoint calls
        # Catches `import pdb`, `pdb.set_trace()`, `breakpoint()`, `import ipdb`.
        # continue-on-error during bootstrap: rl_replacements.py has a
        # `#breakpoint()` comment the regex matches (# is [^A-Za-z_]).
        continue-on-error: true
        run: |
          set -e
          if grep -rnE '(^|[^A-Za-z_])(pdb\.set_trace|breakpoint)\(|^import (pdb|ipdb)$|^from (pdb|ipdb) import' \
              --include='*.py' unsloth_zoo scripts; then
            echo "::error::Leftover debugger call found above. Remove it." >&2
            exit 1
          fi

      - name: YAML round-trip for every committed YAML
        run: |
          python <<'PY'
          import pathlib, sys, yaml
          fails = []
          for p in pathlib.Path(".").rglob("*.yml"):
              if any(part.startswith(".") and part not in (".github",) for part in p.parts):
                  continue
              try:
                  yaml.safe_load(p.read_text())
              except Exception as exc:
                  fails.append(f"{p}: {exc}")
          for p in pathlib.Path(".").rglob("*.yaml"):
              if any(part.startswith(".") and part not in (".github",) for part in p.parts):
                  continue
              try:
                  yaml.safe_load(p.read_text())
              except Exception as exc:
                  fails.append(f"{p}: {exc}")
          if fails:
              for f in fails:
                  print("::error::", f)
              sys.exit(1)
          print(f"YAML round-trip OK")
          PY

      - name: JSON round-trip for every committed JSON
        run: |
          python <<'PY'
          import pathlib, json, sys
          fails = []
          for p in pathlib.Path(".").rglob("*.json"):
              if any(part in (".git", "node_modules", "__pycache__", "build", "dist") for part in p.parts):
                  continue
              try:
                  json.loads(p.read_text())
              except Exception as exc:
                  fails.append(f"{p}: {exc}")
          if fails:
              for f in fails:
                  print("::error::", f)
              sys.exit(1)
          print("JSON round-trip OK")
          PY

      - name: enforce kwargs spacing
        # Style rule mirrored from unsloth: kwargs use `name = value` not `name=value`.
        continue-on-error: true
        run: |
          python3 scripts/enforce_kwargs_spacing.py unsloth_zoo
