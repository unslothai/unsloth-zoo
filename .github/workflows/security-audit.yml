# Pure-Python supply-chain audit for unsloth_zoo. Mirrors unslothai/unsloth's
# security-audit.yml with npm/Cargo/Unsloth jobs stripped (zoo is pure Python).
# Jobs: advisory-audit (pip-audit + trufflehog), pip-scan-packages (transitive
# closure pattern scan), workflow-trigger-lint, tests-security (HARD GATE).

name: Security audit

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'scripts/scan_packages.py'
      - 'scripts/lint_workflow_triggers.py'
      - 'tests/security/**'
      - '.github/workflows/security-audit.yml'
  push:
    branches: [main]
  schedule:
    - cron: '13 4 * * *'   # 04:13 UTC daily, off the cron rush
  workflow_dispatch:

concurrency:
  # The event is part of the group so a scheduled run and a push to main cannot
  # coalesce. Both resolve to refs/heads/main, and the default queue: single keeps
  # only one pending run, so without this a merge burst silently drops the nightly:
  # cancel-in-progress protects the running run, never the pending one.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Latest-only on branches, never on main. Pushes to main land in bursts, so
  # cancelling superseded runs there throws away the run that would have
  # reported a regression, and the run that writes the shared caches.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Advisory-DB audit: pip-audit + trufflehog. Non-blocking while baseline settles.
  advisory-audit:
    name: advisory audit (pip + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # trufflehog needs full history for diff scans
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Build filtered requirements set
        # Reads pyproject.toml deps + extras into a flat requirements file.
        # git+ specs are skipped (advisory-DB can't resolve them).
        run: |
          mkdir -p audit-reqs
          python <<'PY' > audit-reqs/zoo-deps.txt
          import tomllib
          with open("pyproject.toml", "rb") as f:
              d = tomllib.load(f)
          core = d["project"]["dependencies"]
          all_extras = []
          for extra_name, specs in d["project"].get("optional-dependencies", {}).items():
              # Skip self-referential extras like "huggingface = ['unsloth_zoo[core]']".
              all_extras += [s for s in specs if "unsloth_zoo" not in s]
          print("# Auto-generated from pyproject.toml by security-audit.yml.")
          for spec in core + all_extras:
              if "git+" in spec:
                  print(f"# [security-audit] skipped git+ spec: {spec}")
                  continue
              print(spec)
          PY

      - name: pip-audit (advisory DB lookup)
        continue-on-error: true
        run: pip-audit --requirement audit-reqs/zoo-deps.txt --disable-pip --strict || true

      - name: Trufflehog secret scan
        continue-on-error: true
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11  # v3.96.0
        with:
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # pip-scan-packages: downloads every PyPI archive in zoo's transitive closure and
  # pattern-scans (catches the malicious-upload class that precedes CVE publication).
  pip-scan-packages:
    name: pip scan-packages (zoo transitive closure)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install scan_packages.py runtime deps
        # requests + packaging for PyPI's JSON API. Scanned packages are
        # downloaded raw and inspected, never `pip install`-ed.
        run: python -m pip install --upgrade pip requests packaging

      - name: Build filtered requirements set
        run: |
          mkdir -p audit-reqs
          python <<'PY' > audit-reqs/zoo-deps.txt
          import tomllib
          with open("pyproject.toml", "rb") as f:
              d = tomllib.load(f)
          core = d["project"]["dependencies"]
          all_extras = []
          for extra_name, specs in d["project"].get("optional-dependencies", {}).items():
              all_extras += [s for s in specs if "unsloth_zoo" not in s]
          print("# Auto-generated from pyproject.toml by security-audit.yml.")
          for spec in core + all_extras:
              if "git+" in spec:
                  print(f"# [security-audit] skipped git+ spec: {spec}")
                  continue
              print(spec)
          PY

      - name: scan-packages (with deps)
        continue-on-error: true
        # --with-deps makes scan transitive. Archives are downloaded and
        # pattern-scanned WITHOUT installing -- malicious wheels cannot execute.
        run: python3 scripts/scan_packages.py --requirements audit-reqs/zoo-deps.txt --with-deps

  # workflow-trigger-lint: refuses pull_request_target with PR-head checkout,
  # restricted workflow_run without justification, and cache-key collisions.
  workflow-trigger-lint:
    name: workflow-trigger lint (pull_request_target / cache-poisoning)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml==6.0.2

      - name: Run workflow-trigger lint
        run: python3 scripts/lint_workflow_triggers.py

  # HARD GATE: regression tests for scanner + lint scripts. Drift in IOC tables
  # or scanner exit semantics fails this PR at review time.
  tests-security:
    name: pytest tests/security
    runs-on: ubuntu-latest
    # 10 was sized for the pytest-and-pyyaml install this job used to do. Importing
    # the real torch/transformers stack costs several minutes on its own.
    timeout-minutes: 25
    steps:
      - name: Harden runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          # Both PyTorch hosts. download.pytorch.org hands the actual wheel fetch
          # off to PyTorch's R2-backed download-r2.pytorch.org, so allow-listing
          # only the first fails the install with a bare connection refused that
          # reads like an upstream outage rather than an egress denial. Upstream's
          # own guidance is to allow-list the pair:
          # https://dev-discuss.pytorch.org/t/heads-up-libtorch-downloads-now-redirect-to-download-r2-pytorch-org-by-default-use-curl-l/3395
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            download.pytorch.org:443
            download-r2.pytorch.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pytest + PyYAML
        # PyYAML needed by scripts/lint_workflow_triggers.py, exercised via subprocess
        # by tests/security/test_lint_workflow_triggers.py. (See unsloth PR #5397: without
        # pyyaml the lint script exits 2.)
        run: pip install pytest==9.0.3 pyyaml==6.0.2

      - name: Install unsloth_zoo so tests/security can import what it guards
        # tests/security was dependency-free until #1083 added
        # test_model_type_import_guard.py, which imports unsloth_zoo.hf_utils to
        # exercise get_transformers_model_type, the choke point that keeps a
        # config-supplied model_type out of an import path. unsloth_zoo/__init__.py
        # requires unsloth and torch, so on the bare install this job has been
        # failing collection, and with it every push to main since 2026-08-22.
        #
        # Mirrors the install in consolidated-tests-ci.yml's tests/security lane,
        # which is why that copy of this gate is green. CPU torch from
        # download.pytorch.org rather than the CUDA build on PyPI: the CUDA wheel is
        # multiple GB and nothing here needs a device.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.4.0,<2.13.0"
          pip install -e .[core]
          pip install --no-deps "unsloth @ git+https://github.com/unslothai/unsloth@main"

      - name: Run security regression tests
        run: python3 -m pytest tests/security -v
