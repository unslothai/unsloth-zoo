# MLX-specific CI on macOS arm64 (Apple Silicon) so mlx / mlx-lm / mlx-vlm wheels
# resolve. Installs `unsloth_zoo[mlx]`, smoke-imports unsloth_zoo/mlx_*.py modules,
# runs tests/test_mlx_torch_shim_smoke.py. Opt-in via `mlx` label to save macOS minutes.

name: MLX CI on Mac M1

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    # Daily @ 04:23 UTC -- off the security-audit cron rush at 04:13.
    - cron: '23 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Latest-only on branches, never on main. Pushes to main land in bursts, so
  # cancelling superseded runs there throws away the run that would have
  # reported a regression, and the run that writes the shared caches.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  mlx-smoke:
    name: MLX install + import smoke (Apple Silicon, ${{ matrix.mlx }})
    # Opt-in: schedule / workflow_dispatch always run; PR runs only with `mlx` label.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'mlx')
    runs-on: macos-15   # Apple Silicon (M1) hosted runner
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `pinned` is the gate: the exact MLX set pyproject ships, which is what
        # users actually install, so it runs on every execution of this job.
        # `latest` is the detection leg answering "is the next release safe to
        # adopt", added only where nothing is waiting on the answer. Both are
        # needed: with only `pinned` the pin goes stale unnoticed, and with only
        # `latest` the supported combination is never exercised on Apple hardware
        # at all, since PR runs are opt-in behind the `mlx` label.
        mlx: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["pinned", "latest"]' || '["pinned"]') }}
    # The detection leg reports, it does not gate. It deliberately installs
    # combinations nobody supports yet, so letting it fail the workflow would
    # turn every upstream release into a red main until someone bumps the pin.
    continue-on-error: ${{ matrix.mlx == 'latest' }}
    steps:
      # harden-runner block-mode is Linux-only; stay in audit on macOS for parity.
      - name: Harden runner (audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # `.[mlx]` plus a few inline pins; pyproject.toml is what moves.
      - id: pip-cache
        uses: ./.github/actions/pip-cache-restore
        with:
          name: mlx
          key-files: |
            pyproject.toml

      - name: Install zoo with MLX extras
        # pyproject gates MLX deps on darwin+arm64; `.[mlx]` picks them up
        # without the torch-on-Linux-CUDA path.
        #
        # NOTE: pyproject also gates `torch` OFF on darwin+arm64 (mlx is the
        # native path on Apple Silicon), but tests/mlx_simulation/__init__.py
        # unconditionally `import torch` so the torch-spoof shim that powers
        # the test suite can monkeypatch torch.Tensor with MLX-only methods.
        # Install the CPU wheel explicitly first so collection of
        # tests/test_mlx_torch_shim_smoke.py does not fail with
        # ModuleNotFoundError: No module named 'torch'.
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4.0,<2.13.0"
          pip install -e .[mlx]
          pip install pytest==9.0.3
          # The vision model used by tests/test_mlx_generate_metal.py loads
          # remote processor code that imports timm, which .[mlx] does not pull.
          pip install timm

      - uses: ./.github/actions/pip-cache-save
        with:
          dir: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ steps.pip-cache.outputs.key }}
          cache-hit: ${{ steps.pip-cache.outputs.cache-hit }}

      - name: Adopt the newest MLX (detection leg only)
        # pyproject pins mlx and mlx-lm exactly so nobody installing unsloth_zoo is
        # upgraded into a broken release unattended. That pin also holds `.[mlx]`
        # above at the pinned versions forever, and this job is the only lane that
        # runs real MLX on Apple Silicon, so without this leg the pin would
        # silently remove the very check that is supposed to tell us whether the
        # next release is safe to adopt.
        #
        # mlx-vlm is upgraded past its `<0.7.0` ceiling too. The ceiling exists
        # because the current mlx-vlm wants transformers>=5.14.0 against this
        # repo's `transformers<=5.5.0` cap, and leaving it out would mean the one
        # lane that could ever justify lifting that ceiling never tests the
        # version it would be lifted to. Letting transformers move with it is the
        # point of this leg, and is why it does not gate.
        if: matrix.mlx == 'latest'
        run: |
          pip install --upgrade mlx mlx-lm mlx-vlm
          python - <<'PY'
          from importlib.metadata import version
          for name in ("mlx", "mlx-lm", "mlx-vlm"):
              try:
                  print(f"{name}=={version(name)}")
              except Exception as error:
                  print(f"{name}: {error}")
          PY

      - name: MLX module import smoke
        run: |
          python -c "import unsloth_zoo.mlx_loader; print('mlx_loader OK')"
          python -c "import unsloth_zoo.mlx_compile; print('mlx_compile OK')"
          python -c "import unsloth_zoo.mlx_utils; print('mlx_utils OK')"
          python -c "import unsloth_zoo.mlx_trainer; print('mlx_trainer OK')"
          python -c "import unsloth_zoo.mlx_cce; print('mlx_cce OK')"

      - name: tests/test_mlx_torch_shim_smoke.py
        # Exercises the MLX-on-torch shim end-to-end against the real mlx runtime
        # on Apple Silicon; on Linux runners it would run against tests/mlx_simulation/ stubs.
        run: python -m pytest tests/test_mlx_torch_shim_smoke.py -v

      - name: tests/test_mlx_rng_rewind.py
        # PRNG capture and rewind across the mx.compile fallbacks. The Linux CPU
        # lane gates this too, but the mlx 0.32.1 sentinel that broke it shipped
        # in the Metal wheel first, so this is where a repeat surfaces earliest.
        run: python -m pytest tests/test_mlx_rng_rewind.py -v -rs

      - name: tests/test_mlx_switch_lora.py
        # Real-runtime routed LoRA training and adapter lifecycle coverage.
        run: python -m pytest tests/test_mlx_switch_lora.py -v -rs

      - name: tests/test_mlx_save_over_source.py
        # Saving safetensors back over the file they were loaded from. mlx 0.32.1
        # made that fail, which is what took this job red on 2026-08-18.
        run: python -m pytest tests/test_mlx_save_over_source.py -v -rs

      - name: tests/test_qwen35_vjp_metal.py
        # Metal VJP regressions for the qwen3_5 training patches (issue 6002).
        # Not plain pytest: on mlx 0.32.1 this file exits 139 at interpreter
        # shutdown with every test passing. The wrapper returns pytest's own exit
        # code, so real failures still fail. See its docstring; revert once fixed.
        run: python tests/_run_then_exit_hard.py tests/test_qwen35_vjp_metal.py -v -rs

      - name: tests/test_mlx_training_e2e_metal.py
        # Real LoRA training smoke: tiny 4-bit model through FastMLXModel +
        # MLXTrainer, exercising the PR 684 trainer rework end to end.
        run: python -m pytest tests/test_mlx_training_e2e_metal.py -v -rs

      - name: tests/test_mlx_generate.py
        # Batched-generation logic that needs no Metal but does need the mlx-vlm
        # import: release-protocol handling, prompt-kwarg splitting, stop-string
        # trimming, the audio fallback contract, and request validation.
        run: python -m pytest tests/test_mlx_generate.py -v -rs

      - name: tests/test_mlx_generate_metal.py
        # Batched generation on real models: batched-vs-sequential greedy
        # equivalence with aligned sampled-token logprobs, memory-limit
        # restoration, compiled train/generate interplay, and the vision
        # ordering and stop-string contracts.
        run: python -m pytest tests/test_mlx_generate_metal.py -v -rs

      - name: tests/test_mlx_cpt_partition_metal.py
        # CPT partition, target normalization and full-module save routing.
        run: python -m pytest tests/test_mlx_cpt_partition_metal.py -v -rs

      - name: tests/test_mlx_pr684_full_validation_metal.py
        # Deep behavior checks: resume determinism, completion-only training,
        # epoch step counts, SGD coupled decay, real Qwen2-VL LoRA training.
        run: python -m pytest tests/test_mlx_pr684_full_validation_metal.py -v -rs

      - name: tests/test_mlx_quantized_optimizer_state.py
        # 8-bit first-moment numerics on Metal: the affine quantizer rounds
        # differently per backend, so the mlx-cpu job is not a substitute.
        run: python -m pytest tests/test_mlx_quantized_optimizer_state.py -v -rs

      # The three VLM/shape/batching suites, also run on Linux CPU MLX by
      # consolidated-tests-ci.yml. Here they meet real Metal and the mlx-vlm
      # version an Apple Silicon user resolves, which the audio gate is keyed on.
      - name: tests/test_mlx_shape_guard.py
        run: python -m pytest tests/test_mlx_shape_guard.py -v -rs

      - name: tests/test_mlx_vlm_label_masks.py
        # Audio collation, label masking and the family/version gate.
        run: python -m pytest tests/test_mlx_vlm_label_masks.py -v -rs

      - name: tests/test_mlx_batching_and_decay.py
        # test_compiler_review_guards_are_present is deselected here, not skipped
        # in the file: it only asserts on unsloth_zoo.compiler source text, so
        # the Linux job covers it. Importing that module here pulls torch's
        # flop_counter, which raises "isinstance() arg 2 must be a type"
        # registering flex-attention formulas against a triton that is not
        # installable on macOS arm64. A torch problem, not this repo's.
        run: |
          python -m pytest tests/test_mlx_batching_and_decay.py -v -rs \
            --deselect tests/test_mlx_batching_and_decay.py::test_compiler_review_guards_are_present

      # int8 W8A8 prefill. Added to this job rather than to a new workflow: macOS
      # concurrency is capped at 5 jobs account-wide, and this runner already has the
      # MLX stack provisioned, so a second workflow would spend a slot to reinstall
      # what is already here.
      #
      # What this leg can and cannot show. The int8 path needs the M5 neural
      # accelerators, and no GitHub runner tier offers one, so nothing here measures
      # performance. What it does establish, and the Linux leg cannot:
      #
      #   1. The capability probe declines on a real Metal device that lacks M5 int8
      #      tensor ops, and enabling the module then changes a model forward not at
      #      all. That is the configuration every current Mac user is in, so it is the
      #      assertion that matters most.
      #   2. The activation-quant and weight-requant Metal kernels compile and run for
      #      real. They deliberately carry no MetalPerformancePrimitives include, so
      #      they execute here even though the GEMM cannot, and their packed-nibble and
      #      word-boundary arithmetic is the likeliest source of a silent wrong-answer
      #      bug. Linux cannot check it at all.
      #
      # Measured on macos-15/26: mpp::tensor_ops::matmul2d with int8 operands does not
      # load on M1 ("[metal::Device] Unable to load kernel") while a trivial Metal
      # kernel JITs fine on the same runner, so the GEMM stays M5-only by nature rather
      # than by choice.
      - name: tests/test_mlx_int8_prefill_dispatch.py
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
        run: python -m pytest tests/test_mlx_int8_prefill_dispatch.py -v -rs

      - name: tests/test_mlx_int8_prefill_numerics.py
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
        run: python -m pytest tests/test_mlx_int8_prefill_numerics.py -v -rs

      - name: tests/test_mlx_int8_prefill_safety.py
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
        run: python -m pytest tests/test_mlx_int8_prefill_safety.py -v -rs

      - name: int8 prefill Metal kernels vs reference
        # The two MetalPerformancePrimitives-free kernels, checked against the plain-MLX
        # implementations of the same arithmetic. A tolerance of one int8 LSB, because
        # Metal's rint rounds halves to even while mx.round does not, so ties can differ
        # by one and nothing else may.
        run: |
          python -c "
          import mlx.core as mx, mlx.nn as nn
          from unsloth_zoo.mlx.int8_prefill import scales
          from unsloth_zoo.mlx.int8_prefill.backends import metal_mpp, portable

          failures = []
          for bits, gs in [(4, 32), (4, 64), (4, 128)]:
              ql = nn.QuantizedLinear.from_linear(
                  nn.Linear(1024, 2048, bias = False), group_size = gs, bits = bits)
              ws = scales.channel_scale_bound(ql['scales'], ql['biases'], bits)
              mx.eval(ws)
              got = metal_mpp.requantize_weight(
                  ql['weight'], ql['scales'], ql['biases'], ws, bits, gs)
              want = portable.requantize_weight(
                  ql['weight'], ql['scales'], ql['biases'], ws, bits, gs)
              mx.eval(got, want)
              diff = int(mx.abs(got.astype(mx.int32) - want.astype(mx.int32)).max().item())
              print(f'requant bits={bits} gs={gs}: max abs diff = {diff}')
              if diff > 1:
                  failures.append(f'requant bits={bits} gs={gs} diff={diff}')

          x = mx.random.normal((640, 1024)).astype(mx.bfloat16)
          gq, gsc = metal_mpp.quantize_rows(x)
          wq, wsc = portable.quantize_rows(x)
          mx.eval(gq, gsc, wq, wsc)
          qdiff = int(mx.abs(gq.astype(mx.int32) - wq.astype(mx.int32)).max().item())
          sdiff = float(mx.abs(gsc - wsc).max().item())
          print(f'row quant: max abs q diff = {qdiff}, max abs scale diff = {sdiff:.3e}')
          if qdiff > 1 or sdiff > 1e-6:
              failures.append(f'row quant qdiff={qdiff} sdiff={sdiff}')

          assert not failures, failures
          print('OK: Metal quant and requant kernels match the reference')
          "
