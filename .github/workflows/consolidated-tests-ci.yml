# Python compatibility + repo test gate. Adapted from unsloth's consolidated-tests-ci.yml.
# Jobs: python-version-collect (pytest --collect-only on 3.10-3.13), repo-tests-cpu
# (tests/security HARD GATE + CPU-pure zoo tests), core-upstream-matrix (HF/TRL/peft
# drift detector across 3 cells -- the high-value zoo coverage).

name: Tests CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Latest-only on branches, never on main. Pushes to main land in bursts, so
  # cancelling superseded runs there throws away the run that would have
  # reported a regression, and the run that writes the shared caches.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Python compatibility: pytest --collect-only per interpreter.
  #
  # Was a four-cell matrix, which is four runners for four interpreters that share
  # every input but the interpreter. Measured on a main run: 118-132s of execution
  # each, of which 71-83s is the identical torch-CPU + .[core] install, behind a
  # queue whose median is 3986-5025s. Four slots, four queues, ~100s of actual work
  # apiece -- and the assertion is `--collect-only`, so no wheel is even exercised.
  #
  # One runner now, four venvs, run concurrently. The concurrency is what keeps the
  # wall clock near a single cell's rather than four times it, and these lanes are
  # genuinely independent: separate venvs, no ports, no shared state but pip's HTTP
  # cache, which is written through atomic renames.
  #
  # The lanes are collected rather than backgrounded-and-forgotten. A bare `&` would
  # make the step's exit status the LAST lane's, so 3.10 could fail and the step
  # still pass; every lane records its own status and the collect step reads all four.
  python-version-collect:
    name: (Python 3.10-3.13 collect)
    runs-on: ubuntu-latest
    # Four serial installs would be ~7 minutes; concurrently they are closer to one.
    # Budgeted for the serial worst case so a slow mirror degrades to slow, not red.
    timeout-minutes: 25
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Four interpreters on one runner. Each `id` exposes python-path, which is how
      # a lane addresses an interpreter that is no longer the one on PATH -- only the
      # last of these wins PATH, and that is fine because no lane uses it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        id: py310
        with:
          python-version: '3.10'
          cache: 'pip'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        id: py311
        with:
          python-version: '3.11'
          cache: 'pip'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        id: py312
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        id: py313
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install and collect on every interpreter (concurrently)
        env:
          PY310: ${{ steps.py310.outputs.python-path }}
          PY311: ${{ steps.py311.outputs.python-path }}
          PY312: ${{ steps.py312.outputs.python-path }}
          PY313: ${{ steps.py313.outputs.python-path }}
        run: |
          mkdir -p .lanes

          # CPU index avoids the multi-GB CUDA wheel set. `--no-deps unsloth`
          # satisfies the find_spec("unsloth") guard at unsloth_zoo/__init__.py:128.
          lane() {
            version="$1"; interpreter="$2"
            venv=".lanes/venv-$version"
            log=".lanes/$version.log"
            (
              rc=0
              {
                "$interpreter" -m venv "$venv"
                "$venv/bin/python" -m pip install --upgrade pip
                "$venv/bin/pip" install --index-url https://download.pytorch.org/whl/cpu \
                  "torch>=2.4.0,<2.11.0"
                "$venv/bin/pip" install -e .[core]
                "$venv/bin/pip" install --no-deps \
                  "unsloth @ git+https://github.com/unslothai/unsloth@main" || true
                "$venv/bin/pip" install pytest==9.0.3
              } > "$log" 2>&1 || rc=$?
              echo "$rc" > ".lanes/$version.install"

              # Only if the environment stood up: collecting in a half-built venv
              # reports an import error that says nothing about this interpreter.
              if [ "$rc" -eq 0 ]; then
                crc=0
                "$venv/bin/python" -m pytest tests/ --collect-only -q >> "$log" 2>&1 || crc=$?
                echo "$crc" > ".lanes/$version.collect"
              else
                echo "skipped" > ".lanes/$version.collect"
              fi
            ) < /dev/null > /dev/null 2>&1 &
          }

          lane 3.10 "$PY310"
          lane 3.11 "$PY311"
          lane 3.12 "$PY312"
          lane 3.13 "$PY313"
          wait
          echo "all four lanes finished"

      - name: What each interpreter said
        if: always()
        run: |
          failed=0
          for version in 3.10 3.11 3.12 3.13; do
            echo "::group::Python $version"
            cat ".lanes/$version.log" 2>/dev/null || echo "no log: the lane never started"
            echo "::endgroup::"

            # A lane that dies without recording a status is a failure, not a pass.
            # Backgrounding is only safe if a missing result is loud.
            install="$(cat ".lanes/$version.install" 2>/dev/null || echo missing)"
            collect="$(cat ".lanes/$version.collect" 2>/dev/null || echo missing)"
            echo "python $version: install=$install collect=$collect"

            if [ "$install" != "0" ]; then
              echo "::error::python $version: the environment could not be built (status $install)"
              failed=1
            elif [ "$collect" != "0" ]; then
              # Same severity as the `continue-on-error: true` this replaces: a
              # collection failure is reported, and does not fail the job. Changing
              # that is a real decision and does not belong in a CI-shape change.
              echo "::warning::python $version: pytest --collect-only exited $collect"
            fi
          done
          [ "$failed" -eq 0 ] || exit 1

  # CPU-only repo tests. HARD GATE on tests/security.
  repo-tests-cpu:
    name: Repo tests (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install runtime + test deps
        # --no-deps unsloth satisfies the find_spec("unsloth") guard at unsloth_zoo/__init__.py:128.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.4.0,<2.11.0"
          pip install -e .[core]
          pip install --no-deps "unsloth @ git+https://github.com/unslothai/unsloth@main" || true
          pip install pytest==9.0.3 pyyaml==6.0.2

      - name: pytest tests/security (HARD GATE)
        run: python -m pytest tests/security -v

      - name: pytest behavioral gates (HARD GATE)
        # Deterministic, CPU-pure, sub-second files executed as a gate.
        # test_mlx_finetune_last_n_layers was born broken in #669 and stayed
        # invisible until #739 because no job executed it (collect-only plus
        # the macOS shim smoke). test_training_utils_use_cache pins the
        # use_cache disable/restore contract for gradient checkpointing
        # (#715). test_hf_xet_fallback exercises the Xet->HTTP stall fallback
        # + cache-completeness gate (CPU-pure; collect-only would let it
        # regress silently). test_train_on_responses_list_labels pins the
        # tensor-vs-list labels contract for response masking (stub tokenizer,
        # no weights). The preference suite pins token boundaries, scheduling,
        # objective normalization, and reference lifecycle without model weights.
        # test_mlx_quantized_optimizer_routing pins which optim
        # names reach the 8-bit path; it runs under the torch shim so it
        # EXECUTES here rather than skipping (the numerics need real MLX and run
        # in the mlx-cpu job below and on the Apple Silicon job).
        # test_find_common_token_ids_no_match pins the no-match contract for
        # chat-marker core recovery (stub tokenizer, no weights).
        # test_vllm_direct_lora_loading pins the vLLM direct hot-load slot
        # mapping (no GPU, no vLLM needed). test_sft_prepare_dataset_double_bos
        # pins add_special_tokens for text that already carries BOS.
        #
        # The two MoE registry files pin preprocess_weight's layout resolution (#849)
        # and that the weight-preprocessor registry is one dict across the package
        # module and its unsloth_compiled_cache copies. CPU-pure torch, no weights;
        # neither was executed by any job before.
        #
        # The seven base-model-source files are here for the same reason. They pin
        # that an unreachable Hub is never reported as a missing or unquantized
        # model, which is what stops save_pretrained_merged from writing nothing
        # (or writing a 16bit merge over 4bit weights) after a 429. They are
        # CPU-pure and monkeypatch every Hub entry point, so they cost under two
        # seconds. Left out of a gate they would have been collected but never
        # run: `pytest tests/ --collect-only` above proves only that they import.
        # Executing these files here keeps fixture/source drift visible.
        #
        # test_python39_compatibility pins the package to the floor pyproject
        # declares. No job here runs that floor -- the matrix above starts at 3.10 --
        # so a 3.10-only `match` and a module-level `str | Path` both reached main and
        # made the package un-importable on 3.9. It reads the floor from pyproject, so
        # raising requires-python relaxes it rather than making it lie.
        # test_wheel_top_level_packages pins that discovery ships unsloth_zoo and
        # nothing else; collect-only would let the packaging config regress.
        #
        # test_loss_normalization_contract pins num_items_in_batch: the grad-accum
        # guard, and the packed / padding-free boundary count. The second one
        # shipped broken for the same reason this comment keeps repeating -- the
        # file was in NO job, so `--collect-only` proved only that it imports while
        # the count double-removed every document boundary a collator had already
        # masked, inflating loss and every gradient. `.[core]` resolves trl 0.24.0
        # here, which masks labels[position_ids == 0] (trl added that in 0.23.1),
        # so this job exercises the regressed regime on every pull request.
        #
        # The last two are here because `--collect-only` is exactly what missed
        # the bug they cover. `tests/` is not a package, so `from tests.x import
        # y` binds to whatever `tests` package is importable; unsloth's CI runs
        # these files with its own repo root on sys.path and it DOES ship
        # `tests/__init__.py`, so the import resolved there and took the module
        # out at collection, ending that job at exit 2 on every unsloth pull
        # request. Collecting the drift file here proves it still imports under
        # a plain root, and the sweep is a stdlib-only grep that refuses the
        # pattern anywhere in the suite.
        run: |
          python -m pytest \
            tests/test_training_utils_use_cache.py \
            tests/test_loss_normalization_contract.py \
            tests/test_mlx_finetune_last_n_layers.py \
            tests/test_mlx_double_quant_reject.py \
            tests/test_hf_xet_fallback.py \
            tests/test_get_transformers_model_type_empty.py \
            tests/test_train_on_responses_list_labels.py \
            tests/test_mlx_preference.py \
            tests/test_mlx_quantized_optimizer_routing.py \
            tests/test_check_hf_model_exists_transport_errors.py \
            tests/test_hub_transport_errors_single_segment.py \
            tests/test_quant_status_transport_errors.py \
            tests/test_local_base_model_resolution_offline.py \
            tests/test_local_fp8_base_offline_resolution.py \
            tests/test_local_4bit_merge_offline_resolution.py \
            tests/test_gated_and_offline_config_classification.py \
            tests/test_find_common_token_ids_no_match.py \
            tests/test_vllm_direct_lora_loading.py \
            tests/test_sft_prepare_dataset_double_bos.py \
            tests/test_moe_preprocess_weight_transpose.py \
            tests/test_moe_weight_preprocessor_registry_shared.py \
            tests/test_python39_compatibility.py \
            tests/test_checkpoint_modes.py \
            tests/test_wheel_top_level_packages.py \
            tests/test_inductor_codegen_fallback.py \
            tests/test_eager_fallback_latch.py \
            tests/test_recompile_limit_fallback.py \
            tests/test_checkpoint_compile_mix.py \
            tests/test_disabled_hook_graph_break.py \
            tests/test_missing_parent_package_is_drift.py \
            tests/test_sibling_imports_do_not_go_through_a_tests_package.py \
            -v

      - name: pytest MLX adapter-filter gate (HARD GATE)
        # Run in a fresh process so its module-scoped MLX simulation does not
        # inherit module state from another MLX test file.
        run: python -m pytest tests/test_mlx_save_lora_adapters_filter.py -v

      - name: pytest tests/test_mlx_module_exports + zoo-specific CPU tests
        # Run as SEPARATE pytest invocation: tests/security/conftest.py installs a
        # session-scoped network_blocker autouse fixture that would otherwise block
        # test_pypi_version_sync from reaching pypi.org.
        continue-on-error: true
        run: |
          python -m pytest \
            tests/test_mlx_module_exports.py \
            tests/test_rl_replacements_cpu.py \
            tests/test_temporary_patches_imports.py \
            tests/test_zoo_history_regressions.py \
            tests/test_pypi_version_sync.py \
            -v

  # Real MLX numerics on Linux. mlx-cpu publishes a manylinux x86-64 wheel and
  # mx.quantize/dequantize/compile all run on it, so the 8-bit optimizer state
  # is gated on every PR instead of only on the opt-in Apple Silicon job.
  # Separate job: tests/mlx_simulation/ must never be in sys.modules here.
  # Both Linux CPU MLX suites. One runner, two venvs, run concurrently.
  #
  # These were two jobs, 158s and 164s of execution, ~85s of it the same
  # torch-CPU + zoo install, behind ~4000s queues. They must keep SEPARATE
  # ENVIRONMENTS and the source says why: the suites need mlx-lm and mlx-vlm,
  # which the numerics job deliberately omits because resolving them there could
  # move transformers. That is an argument about environments, not about runners,
  # so a venv each satisfies it exactly while costing one slot instead of two.
  mlx-cpu-linux:
    name: "MLX (Linux CPU: numerics + suites)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Build both environments (concurrently)
        run: |
          mkdir -p .lanes

          # numerics: minimal on purpose -- mlx core only, no mlx-lm / mlx-vlm.
          (
            rc=0
            {
              python -m venv .lanes/venv-numerics
              .lanes/venv-numerics/bin/python -m pip install --upgrade pip
              .lanes/venv-numerics/bin/pip install --index-url https://download.pytorch.org/whl/cpu \
                "torch>=2.4.0,<2.11.0"
              .lanes/venv-numerics/bin/pip install -e .[core]
              .lanes/venv-numerics/bin/pip install --no-deps \
                "unsloth @ git+https://github.com/unslothai/unsloth@main" || true
              .lanes/venv-numerics/bin/pip install pytest==9.0.3 "mlx>=0.22.0" mlx-cpu
            } > .lanes/numerics-install.log 2>&1 || rc=$?
            echo "$rc" > .lanes/numerics.install
          ) < /dev/null > /dev/null 2>&1 &

          # suites: the MLX packages MUST resolve in the SAME pip call as .[core].
          # Split, pip solves them independently and mlx-vlm 0.6.9
          # (transformers>=5.14) drags transformers past the <=5.5.0 this project
          # pins: measured 5.5.0 -> 5.14.1. Together, pip honours the cap and lands
          # on the newest mlx-vlm that fits, which is the 0.6.4 ceiling the audio
          # gate records.
          (
            rc=0
            {
              python -m venv .lanes/venv-suites
              .lanes/venv-suites/bin/python -m pip install --upgrade pip
              .lanes/venv-suites/bin/pip install --index-url https://download.pytorch.org/whl/cpu \
                "torch>=2.4.0,<2.11.0"
              .lanes/venv-suites/bin/pip install -e .[core] \
                "mlx>=0.22.0" mlx-cpu "mlx-lm>=0.31.2" "mlx-vlm>=0.4.4"
              .lanes/venv-suites/bin/pip install --no-deps \
                "unsloth @ git+https://github.com/unslothai/unsloth@main" || true
              .lanes/venv-suites/bin/pip install pytest==9.0.3
            } > .lanes/suites-install.log 2>&1 || rc=$?
            echo "$rc" > .lanes/suites.install
          ) < /dev/null > /dev/null 2>&1 &

          wait
          for id in numerics suites; do
            echo "::group::$id install"; cat ".lanes/$id-install.log" 2>/dev/null || true; echo "::endgroup::"
            rc="$(cat ".lanes/$id.install" 2>/dev/null || echo missing)"
            [ "$rc" = "0" ] || { echo "::error::$id environment could not be built (status $rc)"; exit 1; }
          done

      - name: Assert the real MLX runtime is what got installed
        # All the MLX files importorskip mlx.core, and a module that skips
        # wholesale still exits 0, so without this the job could go green having
        # run nothing. tests/mlx_simulation/ is the torch-backed shim.
        run: |
          for venv in .lanes/venv-numerics .lanes/venv-suites; do
            echo "== $venv"
            "$venv/bin/python" - <<'PY'
          import mlx.core as mx
          origin = str(getattr(mx, "__file__", "") or "")
          assert "mlx_simulation" not in origin, f"shim, not real mlx: {origin}"
          assert int(mx.array([1, 2, 3]).sum()) == 6, "mlx cannot add"
          print("real mlx at", origin)
          PY
          done
          .lanes/venv-suites/bin/python -c "import mlx_vlm, mlx_lm; print('mlx-vlm', mlx_vlm.__version__)"
          # If the joint resolution missed the transformers cap, this job is
          # gating an environment the package forbids.
          .lanes/venv-suites/bin/python - <<'PY'
          from importlib.metadata import version
          from packaging.version import Version
          transformers = Version(version("transformers"))
          assert transformers <= Version("5.5.0"), (
              f"transformers {transformers} exceeds the cap this package pins; "
              "the MLX packages were resolved without it"
          )
          print("transformers", transformers, "within the pinned cap")
          PY

      - name: pytest tests/test_mlx_quantized_optimizer_state.py (HARD GATE)
        # -rs surfaces skips; the next step fails the job if the file skipped,
        # because a skipped numeric suite is not a gate.
        run: .lanes/venv-numerics/bin/python -m pytest tests/test_mlx_quantized_optimizer_state.py -v -rs

      - name: Fail if the numeric tests skipped
        run: |
          .lanes/venv-numerics/bin/python -m pytest tests/test_mlx_quantized_optimizer_state.py -q -rs | tee out.txt
          if grep -qiE '[0-9]+ skipped' out.txt; then
            echo "real mlx is installed but the numeric tests skipped"; exit 1
          fi

      - name: tests/test_mlx_rng_rewind.py (HARD GATE)
        # PRNG capture/rewind across the compile fallbacks. Needs mlx core, not
        # Metal, so it gates here; the Apple Silicon lane is opt-in and usually
        # skipped, which guards nothing on a pull request.
        run: .lanes/venv-numerics/bin/python -m pytest tests/test_mlx_rng_rewind.py -v -rs

      - name: Fail if the RNG rewind tests skipped
        run: |
          .lanes/venv-numerics/bin/python -m pytest tests/test_mlx_rng_rewind.py -q -rs | tee rng.txt
          if grep -qiE '[0-9]+ skipped' rng.txt; then
            echo "real mlx is installed but the RNG rewind tests skipped"; exit 1
          fi

      # One pytest process per file: tests/mlx_simulation/ replaces
      # sys.modules["mlx.core"] process-wide, disarming whatever runs after it.
      - name: tests/test_mlx_shape_guard.py
        run: .lanes/venv-suites/bin/python -m pytest tests/test_mlx_shape_guard.py -v -rs

      - name: tests/test_mlx_vlm_label_masks.py
        # Audio collation, label masking and the family/version gate.
        run: .lanes/venv-suites/bin/python -m pytest tests/test_mlx_vlm_label_masks.py -v -rs

      - name: tests/test_mlx_batching_and_decay.py
        run: .lanes/venv-suites/bin/python -m pytest tests/test_mlx_batching_and_decay.py -v -rs
  # Core (HF/TRL/peft) drift matrix. Three cells: HF=4.57.6+TRL<1, HF=latest+TRL=latest,
  # and pyproject defaults.
  #
  # Was a three-cell matrix: three runners, 171-176s of execution each, of which
  # 90-94s is an install that differs only in three version specs, behind a queue
  # whose median is 4577-5115s. The cells cannot share an ENVIRONMENT -- the whole
  # point is that they pin conflicting upstream versions -- but nothing required
  # them to occupy three runners. One runner, three venvs, run concurrently.
  #
  # fail-fast is gone with the matrix and its intent is kept explicitly: drift in
  # one cell must not stop the others being reported, so every lane runs to
  # completion and the collect step names each one.
  core-upstream-matrix:
    name: "Core drift (3 upstream pins)"
    runs-on: ubuntu-latest
    # Three concurrent installs, budgeted for the serial worst case so a slow
    # index degrades to slow rather than to red.
    timeout-minutes: 45
    env:
      # Pure-Python protobuf parser; transformers' bundled *_pb2.py is rejected by C++ protobuf 4+/5+.
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      UNSLOTH_COMPILE_DISABLE: '1'
      # Secondary handshake after find_spec("unsloth") guard at unsloth_zoo/__init__.py:128.
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - name: Harden runner (audit)
        # audit (not block): the cells pull arbitrary transformers/TRL/peft pins.
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Run all three upstream pins (concurrently)
        run: |
          mkdir -p .lanes

          # Resolve the __from_pyproject__ sentinel. Was a separate step writing
          # $GITHUB_ENV, which is per-job and so cannot carry three different
          # answers; it takes the specs as arguments and prints them instead.
          resolve() {
            python - "$@" <<'PY'
          import re, sys, tomllib

          spec_t, spec_r, spec_p = sys.argv[1:4]

          def _pkg_name(spec):
              m = re.match(r"\s*([A-Za-z0-9_.-]+)", spec)
              return (m.group(1).lower() if m else "")

          if "__from_pyproject__" in (spec_t, spec_r, spec_p):
              with open("pyproject.toml", "rb") as f:
                  doc = tomllib.load(f)
              proj = doc.get("project", {})
              all_deps = list(proj.get("dependencies", []))
              for _name, dep_list in proj.get("optional-dependencies", {}).items():
                  all_deps.extend(dep_list)

              # Strip environment markers so the resolved spec is pip-installable.
              def _strip_marker(s):
                  return s.split(";", 1)[0].strip()

              def _pick(spec, name):
                  if spec != "__from_pyproject__":
                      return spec
                  return next((_strip_marker(x) for x in all_deps if _pkg_name(x) == name), name)

              spec_t = _pick(spec_t, "transformers")
              spec_r = _pick(spec_r, "trl")
              spec_p = _pick(spec_p, "peft")

          print(spec_t)
          print(spec_r)
          print(spec_p)
          PY
          }

          # Two-phase install, exactly as the matrix job did it: `-e .[core]` for the
          # pyproject defaults, then `-U <resolved>` to override. The -U is what lets
          # pip DOWNGRADE transformers for the 4.57.6 cell.
          lane() {
            id="$1"; shift
            venv=".lanes/venv-$id"; log=".lanes/$id.log"
            (
              rc=0
              {
                set -x
                specs="$(resolve "$@")"
                spec_t="$(echo "$specs" | sed -n 1p)"
                spec_r="$(echo "$specs" | sed -n 2p)"
                spec_p="$(echo "$specs" | sed -n 3p)"
                echo "resolved: $spec_t | $spec_r | $spec_p"

                python -m venv "$venv"
                "$venv/bin/python" -m pip install --upgrade pip
                # torchvision: transformers' qwen2_vl / qwen2_5_vl image processors
                # import it at module top, so without it the existence probes go red
                # on ModuleNotFoundError rather than on drift. CPU build is plenty.
                "$venv/bin/pip" install --index-url https://download.pytorch.org/whl/cpu \
                  "torch>=2.4.0,<2.11.0" "torchvision<0.26"
                "$venv/bin/pip" install -e .[core]
                "$venv/bin/pip" install --no-deps \
                  "unsloth @ git+https://github.com/unslothai/unsloth@main" || true
                "$venv/bin/pip" install -U "$spec_t" "$spec_r" "$spec_p"
                # bitsandbytes: imported at module scope in saving_utils.py.
                # IPython + ipywidgets: logging_utils.py:50 imports
                # transformers.utils.notebook. Both so the drift detector fires on
                # real drift and not on a missing CI dep.
                "$venv/bin/pip" install 'bitsandbytes>=0.45' 'ipython>=8' 'ipywidgets>=8'
                "$venv/bin/pip" install pytest==9.0.3 packaging
                set +x
                "$venv/bin/pip" show transformers trl peft torch
              } > "$log" 2>&1 || rc=$?
              echo "$rc" > ".lanes/$id.install"

              if [ "$rc" -eq 0 ]; then
                trc=0
                "$venv/bin/python" -m pytest -v --tb=short -rs \
                  tests/test_upstream_pinned_symbols_transformers.py \
                  tests/test_torchvision_video_removed_message.py \
                  tests/test_upstream_pinned_symbols_trl_vllm.py \
                  tests/test_upstream_pinned_symbols_accelerator.py \
                  tests/test_zoo_history_regressions_deep.py \
                  tests/test_upstream_import_fixes_drift.py \
                  tests/test_zoo_source_upstream_refs.py \
                  tests/test_upstream_signatures.py \
                  tests/test_extended_dep_api_pins.py \
                  tests/test_upstream_source_patterns.py \
                  tests/test_compiler_rewriter_exhaustive.py \
                  tests/test_compiler_dynamic_exec.py \
                  tests/test_temporary_patches_exhaustive.py \
                  tests/test_missing_parent_package_is_drift.py \
                  tests/test_unsloth_zoo_lora_merge.py \
                  tests/test_peft_paramwrapper_layout_drift.py \
                  tests/test_transformers_moe_structure_drift.py \
                  tests/test_moe_merge_e2e_cpu.py \
                  tests/test_merge_e2e_hub_unreachable.py \
                  tests/test_gemma4_dtype_drift_guards.py >> "$log" 2>&1 || trc=$?
                echo "$trc" > ".lanes/$id.tests"
              else
                echo "skipped" > ".lanes/$id.tests"
              fi
            ) < /dev/null > /dev/null 2>&1 &
          }

          lane t4576-trl0latest "transformers==4.57.6" "trl>=0.18.2,<1.0.0" "peft>=0.18,<0.20"
          lane tlatest5-trl1latest "transformers>=5,<6" "trl>=1,<2" "peft"
          lane pyproject __from_pyproject__ __from_pyproject__ __from_pyproject__
          wait
          echo "all three lanes finished"
          df -h / | tail -1

      - name: What each pin said
        if: always()
        run: |
          failed=0
          for id in t4576-trl0latest tlatest5-trl1latest pyproject; do
            echo "::group::$id"
            cat ".lanes/$id.log" 2>/dev/null || echo "no log: the lane never started"
            echo "::endgroup::"

            # A lane that dies without recording a status is a failure, not a pass:
            # that is the whole risk of backgrounding, so it is made loud.
            install="$(cat ".lanes/$id.install" 2>/dev/null || echo missing)"
            tests="$(cat ".lanes/$id.tests" 2>/dev/null || echo missing)"
            echo "$id: install=$install tests=$tests"

            if [ "$install" != "0" ]; then
              echo "::error::$id: the environment could not be built (status $install)"
              failed=1
            elif [ "$tests" != "0" ]; then
              # HARD GATE, as it was per-cell: a red lane means real upstream drift.
              echo "::error::$id: the upstream-regression suite failed (status $tests)"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1

