name: studio-export-fix-ci

on:
  push:
    branches: [main, nightly]
    paths:
      - "unsloth_zoo/llama_cpp.py"
      - "tests/test_quantize_gguf_q2_k_l.py"
      - "tests/test_convert_hf_to_gguf_patcher.py"
      - ".github/workflows/studio-export-fix-ci.yml"
  pull_request:
    paths:
      - "unsloth_zoo/llama_cpp.py"
      - "tests/test_quantize_gguf_q2_k_l.py"
      - "tests/test_convert_hf_to_gguf_patcher.py"
      - ".github/workflows/studio-export-fix-ci.yml"

concurrency:
  group: studio-export-fix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  studio-export-fix:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Cap matrix at 3 in flight so Windows stays under the repo-level
      # 5-concurrent-Windows-runner limit when this job runs alongside others.
      max-parallel: 3
      matrix:
        # No macOS leg on purpose. Both test files here are pure Python --
        # monkeypatched subprocess plus AST parsing of upstream sources, no
        # torch and no GGUF binary -- and neither contains a single
        # `sys.platform` / `Darwin` / `arm64` reference, so the macOS row
        # asserted exactly what the Linux row asserts. Windows stays because
        # path handling genuinely differs there. macOS concurrency is capped at
        # 5 jobs account-wide and is shared with unslothai/unsloth, so this was
        # the one routine per-PR macOS job in this repo and it bought no signal.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # 5000/h vs 60/h on raw.githubusercontent.com for the live-upstream tests.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UNSLOTH_COMPILE_DISABLE: '1'
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          # Pure-Python tests: monkeypatch subprocess + AST-parse upstream files.
          # No torch / transformers needed. Keep slim so Windows cold start stays under a minute.
          python -m pip install pytest psutil requests tqdm

      - name: Run patcher + q2_k_l unit tests
        shell: bash
        run: |
          pytest -v \
            tests/test_quantize_gguf_q2_k_l.py \
            tests/test_convert_hf_to_gguf_patcher.py
