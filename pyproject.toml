[build-system]
requires = [
    # setuptools 83+ needs Python 3.10, and we still support 3.9 source installs.
    "setuptools==84.0.0; python_version >= '3.10'",
    "setuptools==80.9.0; python_version < '3.10'",
    "setuptools-scm==10.3.4",
]
build-backend = "setuptools.build_meta"

[project]
name = "unsloth_zoo"
dynamic = ["version"]
description = "Utils for Unsloth"
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = "LGPL-3.0-or-later"
keywords = ["ai", "llm",]
authors = [
    {email = "info@unsloth.ai"},
    {name = "Unsloth AI team"},
]
maintainers = [
    {name = "Daniel Han", email = "danielhanchen@gmail.com"},
    {name = "Michael Han", email = "info@unsloth.ai"},
]
classifiers = [
    "Programming Language :: Python",
]
dependencies = [
    # --- GPU-only deps (skipped on macOS arm64) ---
    "torch>=2.4.0,<2.15.0 ; (sys_platform != 'darwin' or platform_machine != 'arm64')",
    "torchao>=0.13.0 ; (sys_platform != 'darwin' or platform_machine != 'arm64')",
    "triton>=3.0.0 ; ('linux' in sys_platform)",
    "accelerate>=0.34.1 ; (sys_platform != 'darwin' or platform_machine != 'arm64')",
    "trl>=0.18.2,!=0.19.0,<=1.15.0 ; (sys_platform != 'darwin' or platform_machine != 'arm64')",
    "peft>=0.18.0,!=0.11.0 ; (sys_platform != 'darwin' or platform_machine != 'arm64')",
    "cut_cross_entropy ; python_version >= '3.10' and (sys_platform != 'darwin' or platform_machine != 'arm64')",
    # Imported by the vendored fla ShortConvolution, and at module level by remote code that uses
    # it (Ling 3.0). fla-core brought it in before fla was vendored.
    "einops ; (sys_platform != 'darwin' or platform_machine != 'arm64')",
    # --- MLX-only deps (macOS arm64) ---
    # Pin MLX: patch releases broke mx.random.state (#1078, #1081; unslothai/unsloth#9478).
    # Validate Apple Silicon before bumping.
    "mlx==0.32.4 ; (sys_platform == 'darwin' and platform_machine == 'arm64')",
    # Batched APIs need mlx-lm 0.31.2+; allow 0.31.3 on Python 3.10 (0.32 needs Python 3.11).
    "mlx-lm>=0.31.3,<=0.32.2 ; (sys_platform == 'darwin' and platform_machine == 'arm64')",
    # Keep older transformers resolvable: mlx-vlm 0.6.5+ needs >=5.14; 0.6.9 fixes unsloth#9466.
    "mlx-vlm>=0.4.4,<=0.7.9 ; (sys_platform == 'darwin' and platform_machine == 'arm64')",
    # --- Shared deps (all platforms) ---
    "packaging>=24.1",
    # peft 0.18.0 needs transformers.modeling_layers (4.52.0+); 4.52.0-4.52.3 were rejected.
    # Ceiling tracks CUDA/Apple Silicon validation in consolidated-tests-ci.yml; exclusions are tested failures.
    "transformers>=4.52.4,!=4.53.0,!=4.54.0,!=4.55.0,!=4.55.1,!=4.57.4,!=4.57.5,!=5.0.0,!=5.1.0,<=5.17.0",
    "datasets>=3.4.1,!=4.0.*,!=4.1.0,!=4.4.*,!=4.5.0,<5.0.0",
    "sentencepiece>=0.2.0",
    "tqdm",
    "psutil",
    "wheel>=0.42.0",
    "numpy",
    "protobuf",
    "huggingface_hub>=0.34.0",
    "hf_transfer",
    "pillow",
    "regex",
    "msgspec",
    "typing_extensions",
    "filelock",
    # Imported at module level by llama_cpp, rl_environments and vision_utils. It used to arrive
    # through datasets, which dropped it in 5.x.
    "requests",
    # requests and huggingface_hub verify TLS against certifi; 2026.10.19 drops the compromised
    # eMudhra/emSign root, and an older bundle already installed would otherwise be kept.
    "certifi>=2026.10.19",
]

[tool.setuptools.dynamic]
version = {attr = "unsloth_zoo.__init__.__version__"}

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
unsloth_zoo = ["diffusion_studio/*.html"]

[tool.setuptools.packages.find]
# Dotted globs exclude unrelated siblings (e.g. unsloth_zoo_cache) and top-level tests/scripts.
include = ["unsloth_zoo", "unsloth_zoo.*", "unsloth_zoo_downloads", "unsloth_zoo_downloads.*"]
exclude = ["images*", "tests*", "scripts*"]

[project.optional-dependencies]
mlx = [
    # Keep these constraints in sync with the MLX-only dependencies above.
    "mlx==0.32.4",
    "mlx-lm>=0.31.3,<=0.32.2",
    "mlx-vlm>=0.4.4,<=0.7.9",
]
core = [
    "packaging>=24.1",
    "transformers>=4.52.4,!=4.53.0,!=4.54.0,!=4.55.0,!=4.55.1,!=4.57.4,!=4.57.5,!=5.0.0,!=5.1.0,<=5.17.0",
    "datasets>=3.4.1,!=4.0.*,!=4.1.0,!=4.4.*,!=4.5.0,<5.0.0",
    "sentencepiece>=0.2.0",
    "tqdm",
    "psutil",
    "wheel>=0.42.0",
    "numpy",
    "accelerate>=0.34.1",
    "trl>=0.18.2,!=0.19.0,<=1.15.0",
    "peft>=0.18.0,!=0.11.0",
    "protobuf",
    "huggingface_hub>=0.34.0",
    "hf_transfer",
    "cut_cross_entropy ; python_version >= '3.10'",
    "pillow",
    "regex",
    "msgspec",
    "typing_extensions",
    "filelock",
    # Imported at module level by llama_cpp, rl_environments and vision_utils. It used to arrive
    # through datasets, which dropped it in 5.x.
    "requests",
    # requests and huggingface_hub verify TLS against certifi; 2026.10.19 drops the compromised
    # eMudhra/emSign root, and an older bundle already installed would otherwise be kept.
    "certifi>=2026.10.19",
]
huggingface = [
    "unsloth_zoo[core]",
    "triton-windows ; (sys_platform == 'win32') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
]
base = [
    "unsloth_zoo[huggingface]",
]
intelgpu = [
    "torch>=2.4.0",
    "triton>=3.0.0 ; ('linux' in sys_platform)",
    "unsloth_zoo[core]",
]

[project.urls]
homepage = "http://www.unsloth.ai"
documentation = "https://github.com/unslothai/unsloth"
repository = "https://github.com/unslothai/unsloth"

[tool.pytest.ini_options]
# Discover tests under tests/; CI names specific suites, e.g. tests/security.
testpaths = ["tests"]
pythonpath = ["."]
